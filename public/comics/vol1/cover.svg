<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="MNFST! Volume 1 cover">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a160c"/>
      <stop offset="1" stop-color="#5c3a18"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#c9a227"/>
  <rect width="28" height="800" fill="url(#spine)"/>
  <ellipse cx="120" cy="180" rx="210" ry="150" fill="#8a5a1e" opacity="0.28"/>
  <ellipse cx="520" cy="640" rx="240" ry="190" fill="#6b3d14" opacity="0.22"/>
  <rect width="600" height="800" filter="url(#grain)"/>
  <text x="64" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="8" fill="#3d2410">MNFST!</text>
  <text x="64" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#2a160c">VOL. 1</text>
  <text x="64" y="480" font-family="Georgia, serif" font-size="22" fill="#5c3a18">placeholder cover</text>
  <text x="64" y="740" font-family="Georgia, serif" font-size="16" fill="#5c3a18">the paper is the joke</text>
</svg>
