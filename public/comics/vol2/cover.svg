<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="MNFST! Volume 2 cover">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2a18"/>
      <stop offset="1" stop-color="#3d4a22"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="22"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#8a9a3a"/>
  <rect width="28" height="800" fill="url(#spine)"/>
  <ellipse cx="480" cy="200" rx="200" ry="160" fill="#4a5c1c" opacity="0.3"/>
  <ellipse cx="140" cy="680" rx="230" ry="170" fill="#2a3a10" opacity="0.25"/>
  <rect width="600" height="800" filter="url(#grain)"/>
  <text x="64" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="8" fill="#1c2410">MNFST!</text>
  <text x="64" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#141c0c">VOL. 2</text>
  <text x="64" y="480" font-family="Georgia, serif" font-size="22" fill="#2a3a14">placeholder cover</text>
  <text x="64" y="740" font-family="Georgia, serif" font-size="16" fill="#2a3a14">the sequel to paper</text>
</svg>
